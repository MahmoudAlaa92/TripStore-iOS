name: TripStore
options:
  bundleIdPrefix: com.tripstore
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TripStore:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TripStore
    resources:
      - path: TripStore/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tripstore.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: TripStore
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false

  TripStoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TripStoreTests
    dependencies:
      - target: TripStore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TripStore.app/TripStore"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TripStore:
    build:
      targets:
        TripStore: all
        TripStoreTests: [test]
    test:
      targets:
        - TripStoreTests
    run:
      config: Debug
